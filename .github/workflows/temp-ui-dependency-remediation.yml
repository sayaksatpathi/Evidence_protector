name: Temporary UI dependency remediation

on:
  push:
    branches:
      - refactor/use-pinned-log-guardian-engine

permissions:
  contents: write

jobs:
  remediate:
    name: Apply non-breaking npm security updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update lockfile without forced major upgrades
        working-directory: Evidence Protector Web UI
        run: |
          npm audit fix || true
          npm audit --audit-level=high || true

      - name: Commit lockfile only when changed
        run: |
          if git diff --quiet -- "Evidence Protector Web UI/package-lock.json"; then
            echo "No safe lockfile changes available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Evidence Protector Web UI/package-lock.json"
          git commit -m "fix(ui): update vulnerable transitive dependencies"
          git push origin "HEAD:$GITHUB_REF_NAME"
