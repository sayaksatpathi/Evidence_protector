[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-protector-fullstack"
version = "0.1.0"
description = "Full-stack log-integrity and forensic analysis application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "evidence-protector @ https://github.com/sayaksatpathi/Log-Guardian/archive/61654c470803d607b6ef77447db8656e87b79826.zip",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
]
packaging = [
  "pyinstaller>=6.0",
]
dev = [
  "pytest>=7.0",
  "httpx>=0.27",
  "hypothesis>=6.0",
  "coverage>=7.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-python-dateutil",
]

[tool.setuptools]
py-modules = ["evidence_protector_api"]
