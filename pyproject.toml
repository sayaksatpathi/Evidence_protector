[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-protector-fullstack"
version = "0.1.0"
description = "Full-stack Evidence Protector application: API, Web UI, and release tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "evidence-protector @ git+https://github.com/sayaksatpathi/Log-Guardian.git@61654c470803d607b6ef77447db8656e87b79826",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
packaging = [
  "pyinstaller>=6.0",
]
dev = [
  "pytest>=7.0",
  "httpx>=0.27",
  "hypothesis>=6.0",
  "coverage>=7.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-python-dateutil",
]

[tool.setuptools]
py-modules = [
  "evidence_protector_api",
  "evidence_protector_legacy_stdlib",
  "main",
  "asgi",
  "app",
]
